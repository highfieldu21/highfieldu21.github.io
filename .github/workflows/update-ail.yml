# Save as .github/workflows/update-ail.yml
# Manual only: it runs when you press "Run workflow", never on a timer.
name: Get AIL fixtures

on:
  workflow_dispatch:
    inputs:
      from_date:
        description: "Start date (YYYY-MM-DD)"
        default: "2026-09-01"
      to_date:
        description: "End date (YYYY-MM-DD)"
        default: "2027-04-30"
      save_to_repo:
        description: "Also save data/fixtures_ail.json into the repo"
        type: boolean
        default: false

permissions:
  contents: write            # only used when "save_to_repo" is ticked

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Download the feed
        env:
          FROM: ${{ inputs.from_date }}
          TO: ${{ inputs.to_date }}
        run: python script/get-ail-fix.py --from "$FROM" --to "$TO"

      # Always available from the run page, even if you don't save it to the repo.
      - name: Keep a downloadable copy
        uses: actions/upload-artifact@v4
        with:
          name: fixtures_ail
          path: data/fixtures_ail.json
          if-no-files-found: error
          retention-days: 14

      - name: Save to the repo
        if: ${{ inputs.save_to_repo }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fixtures_ail.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add sportsmanager fixtures feed"
            git pull --rebase
            git push
          fi
