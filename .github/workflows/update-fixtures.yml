# Save as .github/workflows/update-data.yml (delete the older workflow file).
# One-time setup: repo Settings > Pages > Build and deployment > Source = "GitHub Actions".
name: Update Fixtures and Results

on:
  push:
    branches: [main]          # change to master if that is your default branch
  schedule:
    - cron: "0 9-23 * * 0,3-6"
    # on the hour, 09:00-23:00 UTC, Wednesday to Sunday
  workflow_dispatch:           # adds a "Run workflow" button

permissions:
  contents: write              # commit the data files
  pages: write                 # publish the site
  id-token: write              # needed by the Pages deploy action

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      # The data refresh runs on the daily schedule and manual runs, not on ordinary pushes.
      - uses: actions/setup-python@v6
        if: github.event_name != 'push'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: github.event_name != 'push'
        run: pip install requests

      - name: Fetch fixtures
        if: github.event_name != 'push'
        run: python script/get-mr-fix.py
        
      - name: Merge Fixture Files       
        if: github.event_name != 'push'      
        run: python script/merge-fixtures.py

      - name: Merge Result Files       
        if: github.event_name != 'push'      
        run: python script/merge-results.py
        
      # Still runs if the fixtures step failed, so one problem doesn't block the other.
      - name: Fetch results
        if: ${{ !cancelled() && github.event_name != 'push' }}
        run: python script/get-mr-res.py

      # The scripts only write their file on success, so committing here is safe.
      # A commit made with the built-in token doesn't start another run, so no loop.
      - name: Commit changes
        id: commit
        if: ${{ !cancelled() && github.event_name != 'push' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fixtures.json data/results.json data/results-all.json data/fixtures-all.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update fixtures and results"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Publish the site from this run, so the new data goes live without a personal token.
      # Scheduled runs publish only when the data changed. Pushes and manual runs always publish.
      - uses: actions/configure-pages@v5
        if: ${{ !cancelled() && (github.event_name != 'schedule' || steps.commit.outputs.changed == 'true') }}

      - uses: actions/upload-pages-artifact@v3
        if: ${{ !cancelled() && (github.event_name != 'schedule' || steps.commit.outputs.changed == 'true') }}
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        if: ${{ !cancelled() && (github.event_name != 'schedule' || steps.commit.outputs.changed == 'true') }}
        uses: actions/deploy-pages@v4
